name = "tres-palabras"
main = "worker/index.js"
compatibility_date = "2025-09-01"
# Direcciones: la de workers.dev sigue activa y, además, el dominio propio.
workers_dev = true
routes = [
  { pattern = "palabras.pecomac.com", custom_domain = true },
]

[assets]
directory = "./web"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESIONES"
class_name = "Sesion"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sesion"]
